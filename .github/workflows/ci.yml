name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu runs the symlink checks; Windows catches platform-specific socket and path bugs.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dev tools
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Node tests
        run: npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/github-reporter.mjs --test-reporter-destination=stdout
      - name: Build Worker
        run: npm run build
      - name: Build Windows desktop
        if: runner.os == 'Windows'
        run: npm run desktop:build
      - name: Python importer tests
        shell: bash
        run: for test in tests/*.test.py; do python "$test" || exit 1; done
